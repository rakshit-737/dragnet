name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (commands, case file with synthetic or public data only)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `dragnet --version` and your Python version
  - type: checkboxes
    id: data
    attributes:
      label: Data hygiene
      options:
        - label: I have not attached real victim data, credentials or malware samples
          required: true
