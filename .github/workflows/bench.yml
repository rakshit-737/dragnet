name: bench

# Full-data benchmark on a GitHub-hosted runner: downloads the pinned public datasets (plus the
# daily abuse.ch exports and the Malpedia API), runs the real-data tests and every benchmark
# section, checks that the deterministic sections reproduce the committed results, and uploads
# results/ and figures as an artifact. Only small result files are ever committed (by hand).

on:
  workflow_dispatch:
    inputs:
      sections:
        description: "comma-separated sections (empty = all)"
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DRAGNET_DATA: ${{ github.workspace }}/../dragnet-data
      PYTHONHASHSEED: "0"   # set iteration order fixed so tie-breaks and float sums reproduce exactly
    defaults:
      run:
        shell: bash   # bash -eo pipefail: a failing command before a pipe (e.g. into tee) fails the step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,bench]"
      - name: Download datasets (pinned sources are SHA-256 checked)
        run: python scripts/download_data.py
      - name: Real-data tests
        run: python -m pytest -q -m realdata
      - name: README real-data quickstart, verbatim (bundled case instead of my_case.json)
        run: |
          mkdir -p /tmp/qs && cd /tmp/qs
          python -m dragnet build-kg | tee build-kg.txt
          grep -q "actors" build-kg.txt
          python -m dragnet case-study olympic_destroyer_2018 --format md > od.md
          grep -q "Insufficient for attribution" od.md
          python -m dragnet assess "$GITHUB_WORKSPACE/dragnet/data/cases/olympic_destroyer_like.json"             --kg "$DRAGNET_DATA/kg-attack-19.2.json" --format json > assess.json
          python -c "import json; d = json.load(open('assess.json')); assert d['hypotheses'], d"
          python -m dragnet export-cypher --kg "$DRAGNET_DATA/kg-attack-19.2.json" -o dragnet.cypher
          test "$(wc -l < dragnet.cypher)" -gt 1000
          python -m pip install -q -e "$GITHUB_WORKSPACE[api]"
          python -m dragnet serve --kg "$DRAGNET_DATA/kg-attack-19.2.json" --port 8765 > serve.log 2>&1 &
          srv=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/health > health.json && break; sleep 1; done
          cat health.json
          curl -sf -X POST http://127.0.0.1:8765/assess -H 'content-type: application/json'             --data @"$GITHUB_WORKSPACE/dragnet/data/cases/olympic_destroyer_like.json" > api.json
          python -c "import json; d = json.load(open('api.json')); assert 'confidence' in d, d"
          kill "$srv"
      - name: Benchmarks
        env:
          SECTIONS: ${{ github.event.inputs.sections }}
        run: |
          mkdir -p fresh
          if [ -n "$SECTIONS" ]; then only="--only $SECTIONS"; else only=""; fi
          /usr/bin/time -v python scripts/run_benchmarks.py --fresh --out fresh $only 2> fresh/time.txt
          tail -25 fresh/time.txt
          cp -r docs/figures fresh/figures
          cp "$DRAGNET_DATA/MANIFEST.json" fresh/data-manifest.json
      - name: Deterministic sections match the committed results
        run: python scripts/compare_results.py results/benchmark.json fresh/benchmark.json | tee fresh/compare.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-results
          path: fresh/
