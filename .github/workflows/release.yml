name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -e ".[dev,api,sign]"
          python -m pytest -q
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [$ver]" 'index($0, h) == 1 {f=1; next} index($0, "## [") == 1 {if (f) exit} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $GITHUB_REF_NAME" > notes.md
          cat notes.md
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rakshit-737/dragnet:${{ github.ref_name }}
            ghcr.io/rakshit-737/dragnet:latest
          labels: org.opencontainers.image.source=https://github.com/rakshit-737/dragnet
      - name: Smoke-test image
        run: docker run --rm ghcr.io/rakshit-737/dragnet:${{ github.ref_name }} demo
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "DRAGNET $GITHUB_REF_NAME" --notes-file notes.md
