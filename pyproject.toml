[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dragnet-attribution"
dynamic = ["version"]
description = "Evidence-to-actor attribution with ACH, false-flag reasoning and conservative, abstention-aware confidence grades on real ATT&CK/MISP/abuse.ch data"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.16.10", "build>=1.2", "numpy>=1.26"]
# httpx2: starlette >= 1.7 TestClient prefers it (httpx alone triggers a deprecation warning)
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "httpx2>=2.13"]
bench = ["matplotlib>=3.8", "numpy>=1.26"]
sign = ["cryptography>=42"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
dragnet = "dragnet.cli:main"

[project.urls]
Homepage = "https://github.com/rakshit-737/dragnet-actor-attribution"
Documentation = "https://rakshit-737.github.io/dragnet-actor-attribution/"

[tool.setuptools]
packages = ["dragnet", "dragnet.sources", "dragnet.data", "dragnet.data.cases", "dragnet.data.real_cases"]

[tool.setuptools.dynamic]
version = { attr = "dragnet.__version__" }

[tool.setuptools.package-data]
"dragnet.data" = ["*.json"]
"dragnet.data.cases" = ["*.json"]
"dragnet.data.real_cases" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["realdata: needs the downloaded public datasets (skipped when absent)"]
# every warning is an error, so the suite stays at zero warnings (StarletteDeprecationWarning is
# not a DeprecationWarning subclass, hence "error" rather than "error::DeprecationWarning")
filterwarnings = ["error"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Explicit rule list so results do not drift with ruff's defaults (ruff is pinned in [dev]).
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "RUF", "ISC", "C4", "PIE", "EXE"]
ignore = ["E402", "E731", "RUF005", "B905"]   # sys.path-first scripts; style-only rules
