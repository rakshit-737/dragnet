[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dragnet"
version = "0.1.0"
description = "Evidence-to-actor attribution pipeline with ACH and chain-of-custody (synthetic-data MVP)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dragnet = "dragnet.cli:main"

[tool.setuptools]
packages = ["dragnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
