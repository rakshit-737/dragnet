[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dragnet"
version = "0.2.0"
description = "Evidence-to-actor attribution with ACH, false-flag reasoning and calibrated confidence on real ATT&CK/MISP/abuse.ch data"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
bench = ["matplotlib>=3.8"]

[project.scripts]
dragnet = "dragnet.cli:main"

[tool.setuptools]
packages = ["dragnet", "dragnet.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["realdata: needs the downloaded public datasets (skipped when absent)"]

[tool.ruff]
line-length = 110
target-version = "py310"
